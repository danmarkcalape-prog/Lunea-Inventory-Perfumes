<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Lunea — Inventory &amp; Invoicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2c2434;
    --plum:#2b2233;
    --plum-deep:#221b29;
    --cream:#faf6ee;
    --paper:#ffffff;
    --line: rgba(44,36,52,0.10);
    --gold:#b98f4c;
    --gold-light:#e7cfa0;
    --gold-dim: rgba(185,143,76,0.14);
    --rose:#b5695f;
    --sage:#5a7d63;
    --muted:#7c7285;
    --danger:#a83f34;
    --radius: 12px;
    --radius-sm: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Jost',-apple-system,sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,h4{
    font-family:'Playfair Display', serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::selection{background:var(--gold-light);}

  #app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:236px;
    flex:none;
    background:linear-gradient(180deg,var(--plum) 0%, var(--plum-deep) 100%);
    color:#f1ecf5;
    display:flex;
    flex-direction:column;
    padding:28px 18px;
    position:relative;
    overflow:hidden;
  }
  .sidebar::before{
    content:"";
    position:absolute; top:-60px; right:-60px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle, rgba(231,207,160,0.10), transparent 70%);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom:8px;
    position:relative; z-index:1;
  }
  .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(231,207,160,0.4);}
  .brand-name{font-family:'Playfair Display',serif; font-size:21px; color:#f6efe0; letter-spacing:0.3px;}
  .brand-tag{font-size:10.5px; color:var(--gold-light); margin:2px 0 26px 0; opacity:0.85; position:relative; z-index:1;}

  nav.navlist{display:flex; flex-direction:column; gap:2px; position:relative; z-index:1;}
  .navlink{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    border-radius:8px;
    color:#d8cee0;
    text-decoration:none;
    font-size:14px;
    border:none; background:transparent; text-align:left; width:100%;
    transition:background .15s ease, color .15s ease;
  }
  .navlink svg{width:16px;height:16px;flex:none;opacity:0.85;}
  .navlink:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .navlink.active{background:rgba(231,207,160,0.14); color:#f6efe0;}
  .navlink.active svg{opacity:1;}

  .sidebar-foot{
    margin-top:auto; padding-top:18px; position:relative; z-index:1;
    font-size:11.5px; color:#9c8fa8; border-top:1px solid rgba(255,255,255,0.08);
  }
  .rate-pill{
    margin-top:14px; padding:10px 12px; border-radius:9px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
  }
  .rate-pill label{display:block;font-size:10.5px;color:#b7abc4;margin-bottom:4px;}
  .rate-pill .rate-row{display:flex;align-items:center;gap:6px;}
  .rate-pill input{
    width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
    color:#f6efe0; border-radius:6px; padding:5px 7px; font-size:13px;
  }

  /* ---------- MAIN ---------- */
  main{flex:1; min-width:0; padding:30px 38px 60px; max-width:1240px;}
  .pagehead{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;}
  .pagehead h1{font-size:27px;}
  .pagehead .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:500;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{border-color:rgba(44,36,52,0.22);}
  .btn-gold{background:var(--gold); border-color:var(--gold); color:#fff;}
  .btn-gold:hover{background:#a67f41;}
  .btn-plum{background:var(--plum); border-color:var(--plum); color:#fff;}
  .btn-plum:hover{background:var(--plum-deep);}
  .btn-danger{color:var(--danger); border-color:rgba(168,63,52,0.35);}
  .btn-danger:hover{background:rgba(168,63,52,0.06);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  /* stat cards */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; position:relative; overflow:hidden;
  }
  .stat-card .label{font-size:12px; color:var(--muted);}
  .stat-card .value{font-family:'Playfair Display',serif; font-size:27px; margin-top:6px; color:var(--ink);}
  .stat-card .value small{font-size:14px; font-weight:500; color:var(--muted);}
  .stat-card .delta{font-size:11.5px; margin-top:6px; color:var(--sage);}
  .stat-card.accent{border-color:rgba(185,143,76,0.35); background:linear-gradient(160deg,#fff, var(--gold-dim) 220%);}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  @media(max-width:920px){.grid-2{grid-template-columns:1fr;}}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:18px;}
  .panel h3{font-size:16px; margin-bottom:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-head h3{margin-bottom:0;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-weight:500; color:var(--muted); font-size:11.5px; padding:0 10px 8px; border-bottom:1px solid var(--line);}
  td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  .muted{color:var(--muted);}
  .tag{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px;
    background:var(--gold-dim); color:#8a6a30; border:1px solid rgba(185,143,76,0.3);
  }
  .tag.low{background:rgba(168,63,52,0.09); color:var(--danger); border-color:rgba(168,63,52,0.25);}
  .tag.market-uae{background:rgba(90,125,99,0.12); color:var(--sage); border-color:rgba(90,125,99,0.3);}
  .tag.market-ph{background:rgba(181,105,95,0.10); color:var(--rose); border-color:rgba(181,105,95,0.28);}

  /* category section */
  .cat-block{margin-bottom:22px;}
  .cat-title{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--gold-light);
  }
  .cat-title h3{font-size:16.5px; display:flex; align-items:center; gap:8px;}
  .cat-title h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .cat-count{font-size:12px;color:var(--muted); font-weight:400;}

  /* forms */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
    background:#fdfcfa; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .calc-line{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; color:var(--muted); border-bottom:1px dashed var(--line);}
  .calc-line b{color:var(--ink); font-weight:500;}

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(34,27,41,0.45); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal{
    background:var(--paper); border-radius:14px; max-width:560px; width:100%;
    max-height:88vh; overflow-y:auto; padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal.wide{max-width:760px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-close{border:none;background:transparent;font-size:20px;color:var(--muted);line-height:1;padding:4px;}
  .modal-close:hover{color:var(--ink);}

  /* invoice builder */
  .invoice-layout{display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start;}
  @media(max-width:980px){.invoice-layout{grid-template-columns:1fr;}}
  .market-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .market-btn{
    flex:1; padding:12px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
    text-align:left; cursor:pointer;
  }
  .market-btn .m-name{font-weight:500; font-size:14px;}
  .market-btn .m-cur{font-size:11.5px; color:var(--muted);}
  .market-btn.active{border-color:var(--gold); background:var(--gold-dim);}

  .pick-row{
    display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);
  }
  .pick-row:last-child{border-bottom:none;}
  .pick-row input[type=checkbox]{width:16px;height:16px; accent-color:var(--gold);}
  .pick-name{flex:1; min-width:0;}
  .pick-name .n{font-size:13.5px;}
  .pick-name .p{font-size:11.5px; color:var(--muted);}
  .qty-box{display:flex; align-items:center; gap:6px;}
  .qty-box button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:14px;line-height:1;}
  .qty-box input{width:40px; text-align:center; padding:4px; border:1px solid var(--line); border-radius:6px;}

  .cart-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .cart-line .l-name{flex:1;}
  .cart-line .l-sub{font-size:11px;color:var(--muted);}
  .cart-total{display:flex; justify-content:space-between; align-items:baseline; padding-top:12px; margin-top:6px; border-top:1px solid var(--ink);}
  .cart-total .amt{font-family:'Playfair Display',serif; font-size:24px;}

  /* invoice preview / print */
  .invoice-doc{background:#fff; padding:6px; font-family:'Jost',sans-serif; color:#2c2434;}
  .invoice-doc .idoc-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--gold); padding-bottom:18px; margin-bottom:22px;}
  .invoice-doc .idoc-brand{display:flex; gap:12px; align-items:center;}
  .invoice-doc .idoc-brand img{width:52px;height:52px;border-radius:50%;}
  .invoice-doc .idoc-brand .nm{font-family:'Playfair Display',serif; font-size:20px;}
  .invoice-doc .idoc-brand .tg{font-size:11px; color:var(--muted);}
  .invoice-doc .idoc-meta{text-align:right; font-size:12.5px; color:var(--muted);}
  .invoice-doc .idoc-meta .num{font-family:'Playfair Display',serif; font-size:18px; color:var(--ink);}
  .invoice-doc .idoc-bill{display:flex; justify-content:space-between; margin-bottom:18px; font-size:13px;}
  .invoice-doc .idoc-bill .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px;}
  .invoice-doc table{margin-bottom:6px;}
  .invoice-doc th{border-bottom:1px solid var(--ink); color:var(--ink); font-size:11.5px; padding-bottom:8px;}
  .invoice-doc td{border-bottom:1px solid var(--line); padding:9px 10px;}
  .idoc-totals{margin-left:auto; width:260px; margin-top:10px;}
  .idoc-totals .row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px;}
  .idoc-totals .row.grand{border-top:2px solid var(--gold); margin-top:6px; padding-top:10px; font-family:'Playfair Display',serif; font-size:19px;}
  .idoc-foot{margin-top:30px; padding-top:16px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--muted); text-align:center;}
  .idoc-sign{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-top:38px;}
  .idoc-sign .stamp-seal{width:92px; height:92px; flex-shrink:0;}
  .idoc-sign .sign-block{flex:1; max-width:230px;}
  .idoc-sign .sign-block .sign-line{border-bottom:1px solid var(--ink); height:38px;}
  .idoc-sign .sign-block .sign-label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:6px;}

  .empty{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty h4{color:var(--ink); margin-bottom:6px; font-size:16px;}

  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--plum); color:#f6efe0;
    padding:12px 18px; border-radius:9px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,0.25);
    z-index:100; display:flex; align-items:center; gap:8px;
    animation:toastin .25s ease;
  }
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{width:28px;height:28px; border-radius:6px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .icon-btn:hover{color:var(--ink); border-color:rgba(44,36,52,0.25);}
  .icon-btn svg{width:14px;height:14px;}

  .searchbar{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-width:280px;}
  .searchbar input{border:none; outline:none; flex:1; background:transparent;}
  .searchbar svg{width:15px;height:15px; color:var(--muted); flex:none;}

  .filter-chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{padding:6px 13px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:12.5px; color:var(--muted);}
  .chip.active{background:var(--plum); color:#f6efe0; border-color:var(--plum);}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; left:0; top:0; width:100%; padding:0;}
    .modal-backdrop{position:absolute; background:none;}
    .modal{box-shadow:none; max-height:none; overflow:visible; padding:0;}
    .no-print{display:none !important;}
  }

  .loading-screen{display:flex; align-items:center; justify-content:center; height:100vh; width:100%; flex-direction:column; gap:10px; color:var(--muted); font-family:'Playfair Display',serif;}

  /* ---------- LOCK SCREEN ---------- */
  .lock-screen{
    min-height:100vh; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #362b40 0%, var(--plum-deep) 60%, #1c1622 100%);
    padding:30px; text-align:center;
  }
  .lock-logo{width:76px;height:76px;border-radius:50%; box-shadow:0 0 0 1px rgba(231,207,160,0.4), 0 10px 40px rgba(0,0,0,0.4); margin-bottom:18px;}
  .lock-screen h1{color:#f6efe0; font-size:28px; margin-bottom:4px;}
  .lock-sub{color:#c9bdd4; font-size:13px; margin-bottom:26px;}
  .pin-input{
    width:220px; text-align:center; letter-spacing:10px; font-size:22px; padding:14px 10px;
    border-radius:10px; border:1px solid rgba(231,207,160,0.35); background:rgba(255,255,255,0.06);
    color:#f6efe0; outline:none;
  }
  .pin-input:focus{border-color:var(--gold-light);}
  .login-input{letter-spacing:normal; text-align:left; font-size:15px; width:260px;}
  .lock-error{color:#e39a8d; font-size:12.5px; margin-top:10px;}
  .lock-hint{color:#8d8098; font-size:11.5px; margin-top:22px;}
  .lock-btn-row{margin-top:16px;}

  /* ---------- RESPONSIVE / MOBILE ---------- */
  @media(max-width:760px){
    #app{flex-direction:column;}
    .sidebar{
      width:100%; flex-direction:row; align-items:center; padding:12px 14px;
      gap:14px; overflow-x:auto; white-space:nowrap;
    }
    .sidebar::before{display:none;}
    .brand{margin-bottom:0; flex:none;}
    .brand-name{font-size:18px;}
    .brand-tag{display:none;}
    nav.navlist{flex-direction:row; gap:4px; flex:none;}
    .navlink{padding:8px 10px; white-space:nowrap;}
    .rate-pill, .sidebar-foot{display:none;}
    main{padding:20px 16px 50px;}
    .pagehead{flex-direction:column; align-items:flex-start;}
    .pagehead h1{font-size:22px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
    .invoice-layout{grid-template-columns:1fr;}
    table{font-size:12px;}
    th,td{padding:8px 6px;}
    .modal{padding:20px;}
    .idoc-head{flex-direction:column; gap:14px;}
    .idoc-meta{text-align:left;}
    .idoc-bill{flex-direction:column; gap:12px;}
    .idoc-bill > div:last-child{text-align:left;}
  }
</style>
<!-- Optional free live database (Firebase). Safe to load even if not configured yet;
     the app runs fine on local/browser storage until FIREBASE_CONFIG below is filled in. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>

<div id="app"><div class="loading-screen">Opening the boutique…</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================================
   LUNEA — Inventory, Sales &amp; Invoicing
   Vanilla JS single-file app. Persists via window.storage (personal/private).
   ========================================================================= */

const FIREBASE_CONFIGURED = !!(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE_'));
let cloudReady = false;
let cloudDb = null;
let cloudUnsubscribers = [];

function detachCloudListeners(){
  cloudUnsubscribers.forEach(fn=>{ try{ fn(); }catch(e){} });
  cloudUnsubscribers = [];
}

function attachCloudListeners(){
  let doneProducts, doneInvoices, doneSettings;
  const whenProducts = new Promise(res=>doneProducts=res);
  const whenInvoices = new Promise(res=>doneInvoices=res);
  const whenSettings = new Promise(res=>doneSettings=res);
  let firstP=true, firstI=true, firstS=true;

  const unsubP = cloudDb.collection('products').onSnapshot(snap=>{
    state.products = snap.docs.map(d=>d.data());
    if(firstP){ firstP=false; doneProducts(); }
    if(state.loaded) renderView();
  }, ()=>{ if(firstP){ firstP=false; doneProducts(); } });

  const unsubI = cloudDb.collection('invoices').onSnapshot(snap=>{
    state.invoices = snap.docs.map(d=>d.data()).sort((a,b)=> (a.seq||0)-(b.seq||0));
    if(firstI){ firstI=false; doneInvoices(); }
    if(state.loaded) renderView();
  }, ()=>{ if(firstI){ firstI=false; doneInvoices(); } });

  const unsubS = cloudDb.collection('meta').doc('settings').onSnapshot(doc=>{
    if(doc.exists){
      state.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), doc.data());
    } else {
      cloudDb.collection('meta').doc('settings').set(state.settings).catch(()=>{});
    }
    if(firstS){ firstS=false; doneSettings(); }
    if(state.loaded) renderView();
  }, ()=>{ if(firstS){ firstS=false; doneSettings(); } });

  cloudUnsubscribers = [unsubP, unsubI, unsubS];
  return Promise.all([whenProducts, whenInvoices, whenSettings]);
}

/* Data-layer helpers used by the UI. Each one writes to the cloud database when
   connected, and otherwise falls back to this device's own storage. */
async function dbSaveProduct(product){
  if(cloudReady){
    try{ await cloudDb.collection('products').doc(product.id).set(product); return; }
    catch(e){ toast('Cloud save failed — saved on this device only', true); }
  }
  const idx = state.products.findIndex(p=>p.id===product.id);

async function dbDeleteProduct(id){
  if(cloudReady){
    try{ await cloudDb.collection('products').doc(id).delete(); return; }
    catch(e){ toast('Cloud delete failed', true); }
  }
  state.products = state.products.filter(p=>p.id!==id);
  await saveProducts();
}
async function dbDeleteInvoice(id){
  if(cloudReady){
    try{ await cloudDb.collection('invoices').doc(id).delete(); return; }
    catch(e){ toast('Cloud delete failed', true); }
  }
  state.invoices = state.invoices.filter(i=>i.id!==id);
  await saveInvoices();
}
async function dbSaveSettings(){
  if(cloudReady){
    try{ await cloudDb.collection('meta').doc('settings').set(state.settings, {merge:true}); return; }
    catch(e){ toast('Cloud save failed — saved on this device only', true); }
  }
  await saveSettings();
}
async function dbCommitInvoice(invoice, updatedProducts){
  if(cloudReady){
    try{
      const batch = cloudDb.batch();
      batch.set(cloudDb.collection('invoices').doc(invoice.id), invoice);
      updatedProducts.forEach(p=>batch.set(cloudDb.collection('products').doc(p.id), p));
      batch.set(cloudDb.collection('meta').doc('settings'), state.settings, {merge:true});
      await batch.commit();
      return;
    }catch(e){ toast('Cloud save failed — saved on this device only', true); }
  }
  state.invoices.push(invoice);
  updatedProducts.forEach(up=>{
    const idx = state.products.findIndex(p=>p.id===up.id);
    if(idx>-1) state.products[idx] = up;
  });
  await saveInvoices();
  await saveProducts();
  await saveSettings();
}

/* ---------------- storage helpers ----------------
   This file can run two ways:
   1) Inside Claude's artifact viewer, where window.storage syncs to your account.
   2) As a plain downloaded HTML file opened directly in a browser, where
      window.storage does not exist at all.
   To make sure data is never silently lost, every read/write tries
   window.storage first and always mirrors to the browser's localStorage too,
   falling back to localStorage automatically when window.storage is absent. */
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function rawGet(key){
  if(hasClaudeStorage()){
    try{
      const r = await window.storage.get(key, false);
      if(r && r.value != null) return r.value;
    }catch(e){ /* not found there, fall through to localStorage */ }
  }
  try{
    const v = localStorage.getItem(key);
    if(v != null) return v;
  }catch(e){ /* localStorage unavailable (e.g. private browsing) */ }
  return null;
}
async function rawSet(key, value){
  let ok = false;
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); ok = true; }catch(e){ /* ignore, still try localStorage */ }
  }
  try{ localStorage.setItem(key, value); ok = true; }catch(e){ /* ignore */ }
  return ok;
}

  }catch(e){ state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); await saveSettings(); }

  state.loaded = true;
}

function fmtAED(n){ return 'AED '+(Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPHP(n){ return '₱'+(Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtMoney(n, market){ return market==='PH' ? fmtPHP(n) : fmtAED(n); }

function remaining(p){ return Math.max(0, (p.onHand||0) - (p.sold||0)); }
function phTotalAED(p){ return (p.uaePrice||0) + (p.shipping||0); }
function phTotalPHP(p){ return phTotalAED(p) * state.settings.rate; }

  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 2600);
}

/* ---------------- computed aggregates ---------------- */
function computeDashboard(){
  const totalOnHand = state.products.reduce((a,p)=>a+(p.onHand||0),0);
  const totalSold = state.products.reduce((a,p)=>a+(p.sold||0),0);
  const totalRemaining = state.products.reduce((a,p)=>a+remaining(p),0);
  const capitalTotal = state.products.reduce((a,p)=>a+(p.cost||0)*(p.onHand||0),0);
  const capitalRemaining = state.products.reduce((a,p)=>a+(p.cost||0)*remaining(p),0);

  let revUAE=0, profitUAE=0, revPH=0, profitPH=0, unitsUAE=0, unitsPH=0;
  state.invoices.forEach(inv=>{
    inv.items.forEach(it=>{
      const lineTotal = it.unitPrice*it.qty;
      const lineCost = (inv.market==='PH' ? it.cost*state.settings.rate : it.cost) * it.qty;
      if(inv.market==='PH'){ revPH+=lineTotal; profitPH+=(lineTotal-lineCost); unitsPH+=it.qty; }
      else{ revUAE+=lineTotal; profitUAE+=(lineTotal-lineCost); unitsUAE+=it.qty; }
    });
  });

  const byCat = {};
  state.products.forEach(p=>{
    byCat[p.category] = byCat[p.category] || {onHand:0,sold:0,remaining:0};
    byCat[p.category].onHand += (p.onHand||0);
    byCat[p.category].sold += (p.sold||0);
    byCat[p.category].remaining += remaining(p);
  });

  return {totalOnHand,totalSold,totalRemaining,capitalTotal,capitalRemaining,revUAE,profitUAE,revPH,profitPH,unitsUAE,unitsPH,byCat};
}

function renderPinConfirmModal(){

async function deleteAllProducts(){

async function restoreStarterCatalog(){
  if(cloudReady){
    try{
      const [prodSnap, invSnap] = await Promise.all([cloudDb.collection('products').get(), cloudDb.collection('invoices').get()]);
      const batch = cloudDb.batch();
      prodSnap.docs.forEach(d=>batch.delete(d.ref));
      invSnap.docs.forEach(d=>batch.delete(d.ref));
      SEED_PRODUCTS.forEach(p=>batch.set(cloudDb.collection('products').doc(p.id), p));
      const freshSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      batch.set(cloudDb.collection('meta').doc('settings'), freshSettings);
      await batch.commit();
    }catch(e){ toast('Cloud reset failed', true); return; }
  } else {
    state.products = SEED_PRODUCTS.slice();
    state.invoices = [];
    state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    await saveProducts(); await saveInvoices(); await saveSettings();
  }
  toast('Starter catalog restored');
  render();
}

async function generateInvoice(){
  const draft = state.draft;
  const items = Object.keys(draft.items).map(id=>({id, qty:draft.items[id]})).filter(x=>x.qty>0);
  if(!items.length){ toast('Select at least one perfume', true); return; }

  // validate stock
  for(const it of items){
    const p = state.products.find(x=>x.id===it.id);
    if(!p || remaining(p) < it.qty){ toast(`Not enough stock for ${p?p.name:'item'}`, true); return; }
  }

  const invItems = items.map(it=>{
    const p = state.products.find(x=>x.id===it.id);
    const price = draft.market==='PH' ? phTotalPHP(p) : p.uaePrice;
    return { productId:p.id, name:p.name, category:p.category, qty:it.qty, unitPrice:price, cost:p.cost };
  });
  const total = invItems.reduce((a,it)=>a+it.unitPrice*it.qty,0);

  const invoiceSeqNum = state.settings.invoiceSeq || 1;
  const invoice = {
    id: uid(),
    seq: invoiceSeqNum,
    number: nextInvoiceNumber(),
    date: todayStr(),
    market: draft.market,
    customer: draft.customer || 'Walk-in customer',
    contact: draft.contact || '',
    items: invItems,
    total,
  };

  // decrement stock (build updated product records without mutating originals in place)
  const updatedProducts = [];
  invItems.forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    if(p){
      const updated = Object.assign({}, p, { sold: (p.sold||0) + it.qty });
      updatedProducts.push(updated);
    }
  });
  state.settings.invoiceSeq = invoiceSeqNum + 1;

  await dbCommitInvoice(invoice, updatedProducts);

  state.draft = { market:'UAE', customer:'', contact:'', notes:'', items:{} };
  state.previewInvoice = invoice;
  renderModal();
  renderView();
}

}

/* ================= EVENT WIRING PER VIEW ================= */
function attachViewHandlers(){
  // dashboard invoice quick view
  document.querySelectorAll('[data-view-invoice]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const inv = state.invoices.find(i=>i.id===el.getAttribute('data-view-invoice'));
      if(inv){ state.previewInvoice = inv; renderModal(); }
    });
  });
  document.querySelectorAll('[data-delete-invoice]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-delete-invoice');
      const inv = state.invoices.find(i=>i.id===id);
      if(inv && confirm(`Delete invoice ${inv.number}? This can't be undone.`)){
        await dbDeleteInvoice(id);
        toast('Invoice deleted');
        renderView();
      }
    });
  });

  if(state.view==='inventory'){
    const addBtn = document.getElementById('add-product-btn');
    if(addBtn) addBtn.onclick = ()=>openProductModal('add', null);
    document.querySelectorAll('[data-cat-filter]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.invFilterCat = el.getAttribute('data-cat-filter'); renderView(); });
    });
    document.querySelectorAll('[data-edit]').forEach(el=>{
      el.addEventListener('click', ()=>{ const p = state.products.find(x=>x.id===el.getAttribute('data-edit')); openProductModal('edit', p); });
    });
    document.querySelectorAll('[data-delete]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = el.getAttribute('data-delete');
        const p = state.products.find(x=>x.id===id);
        if(p && confirm(`Remove "${p.name}" from inventory?`)){
          await dbDeleteProduct(id);
          toast('Perfume removed');
          renderView();
        }
      });
    });
    document.querySelectorAll('[data-restock]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.restockId = el.getAttribute('data-restock'); renderModal(); });
    });
    const searchEl = document.getElementById('inv-search');
    if(searchEl){
      searchEl.addEventListener('input', (e)=>{ state.invSearch = e.target.value; renderView(); document.getElementById('inv-search').focus(); document.getElementById('inv-search').selectionStart = document.getElementById('inv-search').value.length; });
    }
  }

  if(state.view==='invoice'){
    document.querySelectorAll('[data-market]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.draft.market = el.getAttribute('data-market'); renderView(); });
    });
    const cn = document.getElementById('cust-name');
    if(cn) cn.addEventListener('input', (e)=>{ state.draft.customer = e.target.value; });
    const cc = document.getElementById('cust-contact');
    if(cc) cc.addEventListener('input', (e)=>{ state.draft.contact = e.target.value; });
    const ps = document.getElementById('inv-pick-search');
    if(ps) ps.addEventListener('input', (e)=>{ state.invSearch = e.target.value; renderView(); document.getElementById('inv-pick-search').focus(); });

    document.querySelectorAll('[data-pick]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const id = el.getAttribute('data-pick');
        if(el.checked) state.draft.items[id] = 1; else delete state.draft.items[id];
        renderView();
      });
    });
    document.querySelectorAll('[data-qty-inc]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-qty-inc');
        const p = state.products.find(x=>x.id===id);
        const max = p?remaining(p):999;
        state.draft.items[id] = Math.min(max, (state.draft.items[id]||1)+1);
        renderView();
      });
    });
    document.querySelectorAll('[data-qty-dec]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-qty-dec');
        state.draft.items[id] = Math.max(1, (state.draft.items[id]||1)-1);
        renderView();
      });
    });
    document.querySelectorAll('[data-qty-input]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const id = el.getAttribute('data-qty-input');
        const p = state.products.find(x=>x.id===id);
        const max = p?remaining(p):999;
        let v = parseInt(el.value)||1;
        v = Math.max(1, Math.min(max, v));
        state.draft.items[id] = v;
        renderView();
      });
    });
    const genBtn = document.getElementById('generate-invoice-btn');
    if(genBtn) genBtn.onclick = generateInvoice;
    const clearBtn = document.getElementById('clear-draft-btn');
    if(clearBtn) clearBtn.onclick = ()=>{ state.draft.items = {}; renderView(); };
  }

  if(state.view==='history'){
    document.querySelectorAll('[data-hist-filter]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.historyMarket = el.getAttribute('data-hist-filter'); renderView(); });
    });
    const hs = document.getElementById('hist-search');
    if(hs) hs.addEventListener('input', (e)=>{ state.historySearch = e.target.value; renderView(); document.getElementById('hist-search').focus(); });
  }

  if(state.view==='settings'){
    document.getElementById('save-rate-btn').onclick = async ()=>{
      const v = parseFloat(document.getElementById('set-rate').value);
      if(!isNaN(v) && v>0){ state.settings.rate = v; await dbSaveSettings(); toast('Conversion rate saved'); renderView(); }
    };
    document.getElementById('add-cat-btn').onclick = async ()=>{
      const inp = document.getElementById('new-cat-input');
      const v = inp.value.trim();
      if(!v){ return; }
      if(state.settings.categories.includes(v)){ toast('That platform already exists', true); return; }
      state.settings.categories.push(v);
      await dbSaveSettings();
      toast('Platform added');
      renderView();
    };
    document.querySelectorAll('[data-del-cat]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const cat = el.getAttribute('data-del-cat');
        const inUse = state.products.some(p=>p.category===cat);
        if(inUse){ toast('Move or delete its products first', true); return; }
        if(confirm(`Remove platform "${cat}"?`)){
          state.settings.categories = state.settings.categories.filter(c=>c!==cat);
          await dbSaveSettings();
          renderView();
        }
      });
    });
    document.getElementById('save-company-btn').onclick = async ()=>{
      state.settings.company = {
        name: document.getElementById('co-name').value,
        tagline: document.getElementById('co-tag').value,
        phone: document.getElementById('co-phone').value,
        instagram: document.getElementById('co-ig').value,
        address: document.getElementById('co-addr').value,
        note: document.getElementById('co-note').value,
      };
      await dbSaveSettings();
      toast('Company details saved');
      render();
    };
    document.getElementById('delete-invoices-btn').onclick = ()=>{
      askPinThenRun('permanently delete every invoice and reset your sales history', deleteAllInvoices);
    };
    document.getElementById('delete-products-btn').onclick = ()=>{
      askPinThenRun('permanently delete every perfume from your inventory', deleteAllProducts);
    };
    document.getElementById('restore-starter-btn').onclick = ()=>{
      askPinThenRun('erase everything and restore the original 37-item starter catalog', restoreStarterCatalog);
    };
  }
}

/* ================= LOCK SCREEN (local-only / PIN fallback) ================= */
function renderLockScreen(errorMsg){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="lock-screen">
      <img class="lock-logo" src="data:image/jpeg;base64,${LOGO_B64}" alt="Lunea"/>
      <h1>Lunea</h1>
      <div class="lock-sub">Enter your PIN to open the system</div>
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"/>
      ${errorMsg ? `<div class="lock-error">${esc(errorMsg)}</div>` : ''}
      <div class="lock-btn-row"><button class="btn btn-gold" id="unlock-btn">Unlock</button></div>
      <div class="lock-hint">Private to Lunea Perfumes</div>
    </div>
  `;
  const input = document.getElementById('pin-input');
  input.focus();
  const attempt = ()=>{
    if(input.value === APP_PIN){
      unlocked = true;
      markSessionUnlocked();
      bootApp();
    } else {
      renderLockScreen('Incorrect PIN. Please try again.');
    }
  };
  document.getElementById('unlock-btn').addEventListener('click', attempt);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });
}

async function bootApp(){
  document.getElementById('app').innerHTML = '<div class="loading-screen">Opening the boutique…</div>';
  if(!state.loaded){ await loadState(); state.loaded = true; }
  restoreLastView();
  render();
}

function lockApp(){
  clearSessionUnlocked();
  if(cloudReady && typeof firebase !== 'undefined'){
    detachCloudListeners();
    cloudReady = false;
    state.loaded = false;
    firebase.auth().signOut().catch(()=>{});
    // onAuthStateChanged (below) will show the sign-in screen once sign-out completes.
  } else {
    unlocked = false;
    cloudReady = false;
    renderLockScreen();
  }
}

/* ================= LOGIN SCREEN (real per-person accounts, cloud mode) ================= */
function ensureFirebaseApp(){
  if(!FIREBASE_CONFIGURED || typeof firebase === 'undefined') return false;
  if(!cloudDb){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      // Keep people signed in across refreshes and browser restarts on this device,
      // until they tap "Sign out" — that's what fixes the "refresh sends me back
      // to the lock screen" issue.
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
      cloudDb = firebase.firestore();
    }
    catch(e){ return false; }
  }
  return true;
}

      <div class="lock-sub">Sign in to open the system</div>
      <input id="login-email" class="pin-input login-input" type="email" placeholder="Email" autocomplete="username"/>
      <input id="login-pass" class="pin-input login-input" style="margin-top:10px;" type="password" placeholder="Password" autocomplete="current-password"/>
      ${errorMsg ? `<div class="lock-error">${esc(errorMsg)}</div>` : ''}
      <div class="lock-btn-row"><button class="btn btn-gold" id="login-btn">Sign in</button></div>
      <div class="lock-hint">Private to Lunea Perfumes · ask the owner for your login</div>
    </div>
  `;
  document.getElementById('login-email').focus();
  const attempt = async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(!email || !pass){ renderLoginScreen('Enter your email and password.'); return; }
    try{
      await firebase.auth().signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged (below) takes it from here and boots the app.
    }catch(e){
      renderLoginScreen('Could not sign in — check your email and password.');
    }
  };
  document.getElementById('login-btn').addEventListener('click', attempt);
  ['login-email','login-pass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });
  });
}

async function bootCloudApp(){
  document.getElementById('app').innerHTML = '<div class="loading-screen">Opening the boutique…</div>';
  cloudReady = true;
  await attachCloudListeners();
  // On a brand-new, completely empty Firestore project only, seed the starter catalog once.
  if(state.products.length===0 && state.invoices.length===0){
    try{
      const batch = cloudDb.batch();
      SEED_PRODUCTS.forEach(p=>batch.set(cloudDb.collection('products').doc(p.id), p));
      batch.set(cloudDb.collection('meta').doc('settings'), state.settings);
      await batch.commit();
    }catch(e){ /* non-fatal; can add products manually */ }
  }
  state.loaded = true;
  restoreLastView();
  render();
}

/* ================= INIT ================= */
(function init(){
  if(ensureFirebaseApp()){
    document.getElementById('app').innerHTML = '<div class="loading-screen">Opening the boutique…</div>';
    firebase.auth().onAuthStateChanged(async (user)=>{
      if(user){
        if(!state.loaded) await bootCloudApp();
      } else {
        state.loaded = false;
        renderLoginScreen();
      }
    });
  } else if(hasUnlockedSession()){
    // Already unlocked earlier on this device/browser — skip straight past the PIN screen.
    unlocked = true;
    bootApp();
  } else {
    renderLockScreen();
  }
})();
</script>
